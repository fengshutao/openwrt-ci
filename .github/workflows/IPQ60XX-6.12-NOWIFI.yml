name: Build LibWrt ZN-M2

on:
  workflow_dispatch: # 支持手动在 Actions 页面触发编译

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出当前仓库代码
      uses: actions/checkout@main

    - name: 初始化编译环境 (清理空间并安装依赖)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: 克隆 LibWrt 源码
      run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: 更新 feeds 并拉取自定义插件
      working-directory: ./openwrt
      run: |
        # 1. 顶部插入 passwall 软件源
        sed -i '1i\src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' feeds.conf.default
        sed -i '1i\src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' feeds.conf.default
        
        # 2. 更新并安装 feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # 3. 克隆 lucky 源码到 package/lucky
        git clone --depth=1 https://github.com/gdy666/luci-app-lucky.git package/lucky

    - name: 注入 .config 配置
      working-directory: ./openwrt
      run: |
        cat <<EOF > .config
        # ========================
        # 1. 目标机型: 兆能 M2 (IPQ6018)
        # ========================
        CONFIG_TARGET_ipq60xx=y
        CONFIG_TARGET_ipq60xx_generic=y
        CONFIG_TARGET_ipq60xx_generic_DEVICE_zn_m2=y

        # ========================
        # 2. 核心功能: 开启 NSS 与 ECM 界面
        # ========================
        CONFIG_PACKAGE_kmod-qca-nss-dp=y
        CONFIG_PACKAGE_kmod-qca-nss-drv=y
        CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe=y
        CONFIG_PACKAGE_kmod-qca-nss-ecm=y
        CONFIG_PACKAGE_luci-app-nss-ecm=y
        CONFIG_PACKAGE_luci-i18n-nss-ecm-zh-cn=y

        # ========================
        # 3. 剔除 WiFi 和 USB 功能
        # ========================
        # 取消选中无线驱动与相关应用
        # CONFIG_PACKAGE_kmod-ath11k is not set
        # CONFIG_PACKAGE_kmod-ath11k-ahb is not set
        # CONFIG_PACKAGE_kmod-ath11k-pci is not set
        # CONFIG_PACKAGE_ath11k-firmware-ipq6018 is not set
        # CONFIG_PACKAGE_wpad-openssl is not set
        # CONFIG_PACKAGE_wpad-basic-wolfssl is not set
        # CONFIG_PACKAGE_hostapd-common is not set
        # CONFIG_PACKAGE_wireless-tools is not set
        # CONFIG_PACKAGE_iw is not set
        
        # 取消选中 USB 驱动
        # CONFIG_PACKAGE_kmod-usb-core is not set
        # CONFIG_PACKAGE_kmod-usb-dwc3 is not set
        # CONFIG_PACKAGE_kmod-usb-dwc3-qcom is not set
        # CONFIG_PACKAGE_kmod-usb3 is not set
        # CONFIG_PACKAGE_kmod-usb2 is not set

        # ========================
        # 4. 新增用户指定功能
        # ========================
        # Passwall
        CONFIG_PACKAGE_luci-app-passwall=y
        
        # Lucky
        CONFIG_PACKAGE_luci-app-lucky=y
        
        # CPUFreq
        CONFIG_PACKAGE_luci-app-cpufreq=y
        CONFIG_PACKAGE_luci-i18n-cpufreq-zh-cn=y

        # msd_lite (根据用户提供)
        CONFIG_PACKAGE_msd_lite=y
        CONFIG_PACKAGE_luci-app-msd_lite=y
        CONFIG_PACKAGE_luci-i18n-msd_lite-zh-cn=y

        # ttyd (根据用户提供)
        CONFIG_PACKAGE_ttyd=y
        CONFIG_PACKAGE_luci-app-ttyd=y
        CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
        EOF
        
        # 补全配置（生成完整 .config）
        make defconfig

    - name: 下载所需依赖包 (Download dl)
      working-directory: ./openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s

    - name: 整理并上传固件文件
      uses: actions/upload-artifact@v4
      with:
        name: LibWrt_ZN_M2_Firmware
        path: openwrt/bin/targets/ipq60xx/generic/*zn-m2*.*
